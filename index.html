<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sandbox</title>
<style>
  :root { --bg: #f6f5f2; --card: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b; --line: #e4e1da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --card: #1f1f23; --fg: #eeeeee; --muted: #9a9a9a; --line: #2e2e33; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 48px 16px; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 1.8rem; }
  .lede { margin: 0 0 32px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  a.card {
    display: block; padding: 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
    color: inherit; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  .thumb { height: 120px; border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .palette { display: grid; grid-template-columns: repeat(5, 1fr); }
  .palette span:nth-child(1) { background: hsl(200 60% 35%); } .palette span:nth-child(2) { background: hsl(185 55% 50%); }
  .palette span:nth-child(3) { background: hsl(20 70% 62%); }  .palette span:nth-child(4) { background: hsl(35 75% 75%); }
  .palette span:nth-child(5) { background: hsl(210 50% 22%); }
  .lake { background: #3f7d34; display: grid; place-items: center; }
  .lake svg { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  h2 { margin: 0 0 4px; font-size: 1.1rem; }
  p { margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.45; }
</style>
</head>
<body>
<main>
  <h1>Claude Sandbox</h1>
  <p class="lede">Small web experiments.</p>
  <div class="grid">
    <a class="card" href="palette-squares/">
      <div class="thumb palette" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <h2>Palette Squares</h2>
      <p>Generate a fresh grid of colours in a harmonious palette with one click.</p>
    </a>
    <a class="card" href="lake-skipper/">
      <div class="thumb lake" aria-hidden="true">
        <svg viewBox="0 0 84 30" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
          <rect width="84" height="30" fill="#3f7d34"/>
          <rect x="4" y="3" width="76" height="24" fill="#d9c38a"/>
          <rect x="5" y="4" width="74" height="22" fill="#3477b0"/>
          <rect x="18" y="13" width="7" height="4" fill="#8a5a2b"/><rect x="25" y="14" width="1" height="2" fill="#8a5a2b"/>
          <rect x="19" y="14" width="5" height="2" fill="#c99556"/><rect x="20" y="14" width="2" height="2" fill="#d94141"/>
          <rect x="52" y="10" width="5" height="3" fill="#fff"/><rect x="51" y="9" width="1" height="2" fill="#fff"/>
          <rect x="56" y="7" width="1" height="4" fill="#fff"/><rect x="57" y="7" width="1" height="1" fill="#ff8a1e"/>
          <rect x="38" y="20" width="3" height="1" fill="#f28c28"/><rect x="37" y="20" width="1" height="1" fill="#c4621a"/>
          <rect x="66" y="18" width="3" height="1" fill="#ffe066"/><rect x="65" y="18" width="1" height="1" fill="#e0a800"/>
          <rect x="10" y="22" width="3" height="2" fill="#3f9a45"/><rect x="71" y="7" width="3" height="2" fill="#3f9a45"/>
        </svg>
      </div>
      <h2>Lake Skipper</h2>
      <p>A pixel boat game: steer around the lake, net fish and keep clear of the swans.</p>
    </a>
  </div>
</main>
</body>
</html>
