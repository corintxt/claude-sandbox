<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lake Skipper</title>
<style>
  :root { --bg: #14231a; --panel: #2c4a35; --fg: #f3ecd2; --accent: #ffd84a; --muted: #9fb59f; --w: 576px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 12px 16px; background: var(--bg); color: var(--fg);
    font-family: "Courier New", ui-monospace, monospace;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; overflow-x: hidden;
  }
  #hud {
    display: flex; align-items: center; gap: 16px; width: calc(var(--w) + 8px);
    font-weight: 700; font-size: 15px; letter-spacing: .06em;
  }
  #hud .grow { flex: 1; }
  #hud b { color: var(--accent); }
  #lives { color: #ff6b6b; letter-spacing: .15em; }
  #mute { font: inherit; background: var(--panel); color: var(--fg); border: 0; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  #wrap {
    position: relative; width: var(--w); aspect-ratio: 4 / 3; box-sizing: content-box;
    border: 4px solid #0c150f; box-shadow: 0 0 0 4px #3a5a40, 0 12px 30px rgba(0,0,0,.5);
  }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 16px; text-align: center; background: rgba(8, 18, 28, .6);
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: clamp(24px, 7vw, 44px); color: var(--accent); text-shadow: 3px 3px 0 #000; letter-spacing: .06em; }
  #overlay p { margin: 0; max-width: 34ch; font-size: clamp(12px, 2.8vw, 16px); line-height: 1.4; text-shadow: 2px 2px 0 #000; }
  #overlay .small { color: var(--muted); font-size: clamp(11px, 2.4vw, 14px); }
  .big-btn {
    font: inherit; font-weight: 700; font-size: 18px; letter-spacing: .08em; padding: 10px 28px; margin-top: 6px;
    background: var(--accent); color: #1a1a1a; border: 0; box-shadow: 0 4px 0 #a8861c; cursor: pointer;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8861c; }
  #controls {
    display: none; width: calc(var(--w) + 8px); gap: 8px;
    grid-template-columns: repeat(3, 60px) 1fr 96px; grid-template-rows: 54px 54px;
    grid-template-areas: ". u . . n" "l d r . n";
  }
  #controls button {
    font: inherit; font-size: 22px; font-weight: 700; border: 0; border-radius: 10px;
    background: var(--panel); color: var(--fg); box-shadow: 0 4px 0 #0e1a12; touch-action: none;
  }
  #controls button.on { transform: translateY(3px); box-shadow: 0 1px 0 #0e1a12; }
  #controls [data-k=up] { grid-area: u; } #controls [data-k=down] { grid-area: d; }
  #controls [data-k=left] { grid-area: l; } #controls [data-k=right] { grid-area: r; }
  #controls [data-k=net] { grid-area: n; background: var(--accent); color: #1a1a1a; font-size: 18px; box-shadow: 0 4px 0 #a8861c; }
  #help { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
  @media (pointer: coarse) { #controls { display: grid; } #help { display: none; } }
</style>
</head>
<body>
  <div id="hud">
    <span>SCORE <b id="score">0</b></span>
    <span id="lives">♥♥♥</span>
    <span class="grow"></span>
    <span>BEST <b id="best">0</b></span>
    <button id="mute" title="Sound on/off (M)">♪ ON</button>
  </div>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="overlay"></div>
  </div>
  <div id="controls">
    <button data-k="left" aria-label="Turn left">◀</button>
    <button data-k="up" aria-label="Forward">▲</button>
    <button data-k="right" aria-label="Turn right">▶</button>
    <button data-k="down" aria-label="Reverse">▼</button>
    <button data-k="net">NET</button>
  </div>
  <p id="help">Arrows / WASD to steer · Space to cast net · P to pause · M to mute</p>

<script>
"use strict";
const W = 192, H = 144;
const cvs = document.getElementById('game');
cvs.width = W; cvs.height = H;
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- Lake geometry (a superellipse) ---------- */
const CX = 96, CY = 74, A = 84, B = 60;
function lakeVal(x, y, m = 0) { const u = (x - CX) / (A - m), v = (y - CY) / (B - m); return u*u*u*u + v*v*v*v; }
function inLake(x, y, m = 0) { return lakeVal(x, y, m) < 1; }
function randomLakePoint(m = 10, awayFrom = null, minDist = 0) {
  for (let i = 0; i < 200; i++) {
    const x = CX + (Math.random() * 2 - 1) * A, y = CY + (Math.random() * 2 - 1) * B;
    if (!inLake(x, y, m)) continue;
    if (awayFrom && Math.hypot(x - awayFrom.x, y - awayFrom.y) < minDist) continue;
    return { x, y };
  }
  return { x: CX, y: CY };
}
function hash(x, y) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* ---------- Background, painted once ---------- */
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(function paintBackground() {
  const g = bg.getContext('2d');
  const img = g.createImageData(W, H), d = img.data;
  const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const C = {
    g1: hex('#3f7d34'), g2: hex('#4a8c3a'), g3: hex('#356b2c'), fl: hex('#f4e27a'),
    sand: hex('#d9c38a'), sand2: hex('#c9b077'),
    shallow: hex('#4f94c8'), mid: hex('#3477b0'), deep: hex('#2b64a0'),
  };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const wob = 0.07 * Math.sin(x * 0.35 + y * 0.1) + 0.05 * Math.cos(y * 0.4 - x * 0.17);
    const v = lakeVal(x + .5, y + .5) + wob, n = hash(x, y);
    let c;
    if (v < 0.3 || (v < 0.38 && n < 0.5)) c = C.deep;
    else if (v < 0.8 || (v < 0.86 && n < 0.5)) c = C.mid;
    else if (v < 1) c = C.shallow;
    else if (v < 1.16) c = n < 0.2 ? C.sand2 : C.sand;
    else c = n < 0.006 ? C.fl : n < 0.12 ? C.g3 : n < 0.55 ? C.g1 : C.g2;
    const i = (y * W + x) * 4;
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);

  const disc = (cx, cy, r, col) => {
    g.fillStyle = col;
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x*x + y*y <= r*r + r * .8) g.fillRect(cx + x, cy + y, 1, 1);
  };
  // Trees in the corners
  for (const [x, y, r] of [[8, 8, 7], [22, 4, 5], [184, 10, 8], [170, 3, 5], [6, 136, 7], [20, 141, 5], [186, 134, 7], [172, 141, 5], [96, 2, 4], [110, 1, 3]]) {
    disc(x + 2, y + 2, r, '#1f3d22');
    disc(x, y, r, '#2a5a2e');
    disc(x - 1, y - 1, r - 2, '#33703a');
    g.fillStyle = '#4d8f4a'; g.fillRect(x - Math.ceil(r / 2), y - Math.ceil(r / 2), 2, 1);
  }
  // Reeds / cattails along the shore
  for (let k = 0, placed = 0; k < 4000 && placed < 34; k++) {
    const x = Math.floor(Math.random() * W), y = Math.floor(Math.random() * H), v = lakeVal(x, y);
    if (v > 0.97 && v < 1.08) {
      g.fillStyle = '#2d5a27'; g.fillRect(x, y - 3, 1, 4);
      if (Math.random() < .6) { g.fillStyle = '#6b3f1d'; g.fillRect(x, y - 4, 1, 2); }
      if (Math.random() < .5) { g.fillStyle = '#3c7232'; g.fillRect(x + 1, y - 2, 1, 3); }
      placed++;
    }
  }
  // Lily pads
  for (let k = 0, placed = 0; k < 4000 && placed < 7; k++) {
    const x = Math.floor(Math.random() * W), y = Math.floor(Math.random() * H), v = lakeVal(x, y);
    if (v > 0.55 && v < 0.85) {
      disc(x, y, 3, '#3f9a45');
      g.fillStyle = '#2f7a36'; g.fillRect(x - 1, y + 1, 2, 1);
      g.fillStyle = '#3477b0'; g.fillRect(x + 1, y - 1, 2, 1); g.fillRect(x + 3, y - 2, 1, 1);
      if (placed % 2 === 0) { g.fillStyle = '#f5a3c7'; g.fillRect(x - 1, y - 1, 2, 2); g.fillStyle = '#fff2a8'; g.fillRect(x - 1, y - 1, 1, 1); }
      placed++;
    }
  }
})();

const sparkles = [];
for (let i = 0; i < 70; i++) { const p = randomLakePoint(6); sparkles.push({ x: Math.round(p.x), y: Math.round(p.y), p: Math.random() * 20 }); }

/* ---------- Pixel sprites ---------- */
function sprite(rows, pal, flip = false) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][flip ? w - 1 - x : x];
    if (ch !== '.') { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
  }
  return c;
}
// Rotate pixel art by nearest-neighbour sampling so it stays crisp.
function rotatedSprite(rows, pal, a) {
  const h = rows.length, w = rows[0].length, S = Math.ceil(Math.hypot(w, h)) + 1;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), cs = Math.cos(a), sn = Math.sin(a);
  for (let oy = 0; oy < S; oy++) for (let ox = 0; ox < S; ox++) {
    const dx = ox + .5 - S / 2, dy = oy + .5 - S / 2;
    const sx = Math.floor(dx * cs + dy * sn + w / 2), sy = Math.floor(-dx * sn + dy * cs + h / 2);
    if (sx < 0 || sy < 0 || sx >= w || sy >= h) continue;
    const ch = rows[sy][sx];
    if (ch !== '.') { g.fillStyle = pal[ch]; g.fillRect(ox, oy, 1, 1); }
  }
  return c;
}

const BOAT_ROWS = [
  "..ooooooo...",
  ".oBBBBBBBoo.",
  "oBbppbbbbBo.",
  "oBbphbbbbbBo",
  "oBbppbbbbBo.",
  ".oBBBBBBBoo.",
  "..ooooooo...",
];
const BOAT_PAL = { o: '#3b2412', B: '#8a5a2b', b: '#c99556', p: '#d94141', h: '#f2c79a' };
const BOAT_DIRS = 32;
const BOAT = Array.from({ length: BOAT_DIRS }, (_, i) => rotatedSprite(BOAT_ROWS, BOAT_PAL, i / BOAT_DIRS * Math.PI * 2));

const SWAN_ROWS = [
  "........ww.",
  ".......wwko",
  "........w..",
  "........w..",
  "ww......w..",
  "www....ww..",
  "wwwgggwww..",
  ".wwwwwwws..",
  "..sssssss..",
];
const SWAN_PAL = { w: '#ffffff', g: '#d3dbe4', k: '#111111', o: '#ff8a1e', s: '#a9c6dd' };
const SWAN_R = sprite(SWAN_ROWS, SWAN_PAL), SWAN_L = sprite(SWAN_ROWS, SWAN_PAL, true);

const FISH_ROWS = ["t.fff..", "tffffkf", "t.fff.."];
const FISH = {
  R: sprite(FISH_ROWS, { t: '#c4621a', f: '#f28c28', k: '#1a1a1a' }),
  L: sprite(FISH_ROWS, { t: '#c4621a', f: '#f28c28', k: '#1a1a1a' }, true),
  GR: sprite(FISH_ROWS, { t: '#e0a800', f: '#ffe066', k: '#1a1a1a' }),
  GL: sprite(FISH_ROWS, { t: '#e0a800', f: '#ffe066', k: '#1a1a1a' }, true),
};

function drawC(img, x, y) { ctx.drawImage(img, Math.round(x - img.width / 2), Math.round(y - img.height / 2)); }

/* ---------- Tiny 3x5 pixel font for in-game popups ---------- */
const GLYPHS = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111',
  '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001001001001',
  '8': '111101111101111', '9': '111101111001111', '+': '000010111010000', '-': '000000111000000',
  'x': '000101010101000', 'L': '100100100100111', 'V': '101101101101010', '!': '010010010000010',
};
function pText(str, x, y, col) {
  const x0 = Math.round(x - (str.length * 4 - 1) / 2), y0 = Math.round(y);
  for (const [color, off] of [['#000', 1], [col, 0]]) {
    ctx.fillStyle = color;
    [...str].forEach((ch, i) => {
      const g = GLYPHS[ch]; if (!g) return;
      for (let p = 0; p < 15; p++) if (g[p] === '1') ctx.fillRect(x0 + i * 4 + (p % 3) + off, y0 + Math.floor(p / 3) + off, 1, 1);
    });
  }
}

/* ---------- Sound ---------- */
let actx = null, muted = false;
function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const now = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, now);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), now + dur);
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g).connect(actx.destination); o.start(now); o.stop(now + dur);
  } catch (e) { /* audio unavailable */ }
}
const seq = (notes, step, type, dur) => notes.forEach((f, i) => setTimeout(() => beep(f, dur, type), i * step));
const sfx = {
  net: () => beep(320, 0.15, 'triangle', 0.08, -200),
  fish: () => seq([660, 990], 70, 'square', 0.1),
  gold: () => seq([660, 880, 1100, 1320], 60, 'square', 0.1),
  honk: () => beep(230, 0.3, 'sawtooth', 0.06, -120),
  level: () => seq([523, 659, 784], 90, 'triangle', 0.14),
  over: () => seq([440, 330, 220], 180, 'triangle', 0.25),
};

/* ---------- Game state ---------- */
const $ = id => document.getElementById(id);
let best = 0;
try { best = +localStorage.getItem('lakeSkipperBest') || 0; } catch (e) {}
let state = 'title';
let boat, fish, swans, parts, floats, net, score, lives, t, netCD, invuln, spawnT, wakeT, level, shake;

function reset() {
  boat = { x: CX, y: CY + 32, vx: 0, vy: 0, a: -Math.PI / 2 };
  fish = []; swans = []; parts = []; floats = []; net = null;
  score = 0; lives = 3; t = 0; netCD = 0; invuln = 1.5; spawnT = 0; wakeT = 0; level = 1; shake = 0;
  for (let i = 0; i < 4; i++) spawnFish();
  addSwan();
  updateHud();
}
function spawnFish() {
  const p = randomLakePoint(12, boat, 28), gold = Math.random() < 0.12;
  fish.push({ x: p.x, y: p.y, a: Math.random() * Math.PI * 2, turn: 0, age: 0, gold,
    sp: gold ? 20 + Math.random() * 8 : 11 + Math.random() * 9, life: gold ? 7 : 10 + Math.random() * 8 });
}
function addSwan() {
  const p = randomLakePoint(10, boat, 70);
  swans.push({ x: p.x, y: p.y, a: Math.random() * Math.PI * 2, ta: Math.random() * Math.PI * 2, wt: 0, cool: 0, chase: false, bob: Math.random() * 6 });
  splash(p.x, p.y, 8, '#ffffff');
}
function splash(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 15 + Math.random() * 30, l = 0.3 + Math.random() * 0.35;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, col, layer: 1 });
  }
}
function steer(a, target, rate) {
  const d = ((target - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  return a + Math.max(-rate, Math.min(rate, d));
}
function updateHud() {
  $('score').textContent = score;
  $('best').textContent = best;
  $('lives').textContent = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives));
}

/* ---------- Input ---------- */
const keys = {};
let netPressed = false;
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'net' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); keys[k] = true; if (k === 'net' && !e.repeat) netPressed = true; }
  if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat && (state === 'title' || state === 'over')) start();
  else if ((e.code === 'Enter' || e.code === 'Space') && state === 'pause') togglePause();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

document.querySelectorAll('#controls button').forEach(btn => {
  const k = btn.dataset.k;
  const down = e => { e.preventDefault(); keys[k] = true; btn.classList.add('on'); if (k === 'net') netPressed = true; try { btn.setPointerCapture(e.pointerId); } catch (_) {} };
  const up = () => { keys[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('lostpointercapture', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
$('mute').addEventListener('click', toggleMute);
function toggleMute() { muted = !muted; $('mute').textContent = muted ? '♪ OFF' : '♪ ON'; }

/* ---------- Overlay screens ---------- */
const overlay = $('overlay');
function showOverlay(html, btnLabel, onClick) {
  overlay.innerHTML = html + `<button class="big-btn">${btnLabel}</button>`;
  overlay.querySelector('button').addEventListener('click', onClick);
  overlay.classList.remove('hidden');
}
function titleScreen() {
  showOverlay(`<h1>LAKE SKIPPER</h1>
    <p>Steer your boat, cast your net and catch fish.<br>Don't upset the swans.</p>
    <p class="small">Gold fish are worth 50 · net several at once for a combo</p>`, 'START', start);
}
function start() {
  reset(); state = 'play'; overlay.classList.add('hidden');
  if (actx && actx.state === 'suspended') actx.resume();
  netPressed = false;
}
function togglePause() {
  if (state === 'play') { state = 'pause'; showOverlay('<h1>PAUSED</h1>', 'RESUME', togglePause); }
  else if (state === 'pause') { state = 'play'; overlay.classList.add('hidden'); netPressed = false; }
}
function gameOver() {
  state = 'over'; sfx.over();
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('lakeSkipperBest', best); } catch (e) {} }
  updateHud();
  showOverlay(`<h1>GAME OVER</h1><p>You caught <b>${score}</b> points of fish.</p>
    <p class="small">${isBest ? '★ New best score! ★' : 'Best: ' + best}</p>`, 'PLAY AGAIN', start);
}

/* ---------- Update ---------- */
function castNet() {
  const c = Math.cos(boat.a), s = Math.sin(boat.a);
  net = { x: Math.round(boat.x + c * 13), y: Math.round(boat.y + s * 13), t: 0 };
  netCD = 0.55; sfx.net(); splash(net.x, net.y, 6, '#d4ebf7');
  const caught = fish.filter(f => f.age > 0.3 && Math.hypot(f.x - net.x, f.y - net.y) < 10.5);
  if (!caught.length) return;
  const pts = caught.reduce((sum, f) => sum + (f.gold ? 50 : 10), 0) * caught.length;
  const gold = caught.some(f => f.gold);
  score += pts;
  fish = fish.filter(f => !caught.includes(f));
  caught.forEach(f => splash(f.x, f.y, 8, gold ? '#ffe066' : '#ffb366'));
  floats.push({ x: net.x, y: net.y - 10, text: '+' + pts, col: gold ? '#ffe066' : '#ffffff', life: 1.1 });
  if (caught.length > 1) floats.push({ x: net.x, y: net.y - 17, text: 'x' + caught.length, col: '#ff9a3c', life: 1.1 });
  gold ? sfx.gold() : sfx.fish();
  updateHud();
}

function hit(s, dx, dy, d) {
  lives--; invuln = 2; shake = 0.35; s.cool = 2.5;
  const k = Math.max(d, 0.01);
  boat.vx = dx / k * 55; boat.vy = dy / k * 55;
  sfx.honk(); splash(boat.x, boat.y, 12, '#ffffff');
  floats.push({ x: boat.x, y: boat.y - 10, text: '-1', col: '#ff6b6b', life: 1 });
  updateHud();
  if (lives <= 0) gameOver();
}

function updateBoat(dt) {
  let c = Math.cos(boat.a), s = Math.sin(boat.a);
  let fwd = boat.vx * c + boat.vy * s, lat = -boat.vx * s + boat.vy * c;
  const turn = 2.3 * (0.45 + Math.min(1, Math.abs(fwd) / 40)) * (fwd < -2 ? -1 : 1);
  if (keys.left) boat.a -= turn * dt;
  if (keys.right) boat.a += turn * dt;
  if (keys.up) fwd += 75 * dt;
  if (keys.down) fwd -= 50 * dt;
  fwd *= Math.pow(0.55, dt); lat *= Math.pow(0.03, dt);
  fwd = Math.max(-25, Math.min(58, fwd));
  c = Math.cos(boat.a); s = Math.sin(boat.a);
  boat.vx = c * fwd - s * lat; boat.vy = s * fwd + c * lat;
  const nx = boat.x + boat.vx * dt, ny = boat.y + boat.vy * dt;
  if (inLake(nx, boat.y, 6)) boat.x = nx; else boat.vx *= -0.4;
  if (inLake(boat.x, ny, 6)) boat.y = ny; else boat.vy *= -0.4;

  wakeT -= dt;
  if (Math.hypot(boat.vx, boat.vy) > 8 && wakeT <= 0) {
    wakeT = 0.05;
    for (const side of [-1, 1]) {
      parts.push({ x: boat.x - c * 6 - s * side * 2.5, y: boat.y - s * 6 + c * side * 2.5,
        vx: -s * side * 6, vy: c * side * 6, life: 0.8, max: 0.8, col: '#d4ebf7', layer: 0 });
    }
  }
}

function update(dt, live) {
  t += dt;
  shake = Math.max(0, shake - dt);
  invuln = Math.max(0, invuln - dt);
  if (live) {
    updateBoat(dt);
    netCD -= dt;
    if (netPressed && netCD <= 0) castNet();
  }
  netPressed = false;
  if (net && (net.t += dt) > 0.35) net = null;

  // Fish: wander, flee the boat when it gets close, dive away after a while.
  for (const f of fish) {
    f.age += dt;
    const dx = f.x - boat.x, dy = f.y - boat.y;
    let sp = f.sp;
    if (live && Math.hypot(dx, dy) < 18) { f.a = steer(f.a, Math.atan2(dy, dx), 3 * dt); sp *= 1.4; }
    else { f.turn = Math.max(-1.5, Math.min(1.5, f.turn + (Math.random() - .5) * 6 * dt)); f.a += f.turn * dt; }
    const nx = f.x + Math.cos(f.a) * sp * dt, ny = f.y + Math.sin(f.a) * sp * dt;
    if (inLake(nx, ny, 8)) { f.x = nx; f.y = ny; } else f.a = Math.atan2(CY - f.y, CX - f.x) + (Math.random() - .5);
  }
  fish = fish.filter(f => f.age < f.life);
  const maxFish = Math.min(7, 4 + Math.floor(level / 2));
  spawnT -= dt;
  if (fish.length < maxFish && spawnT <= 0) { spawnFish(); spawnT = 0.8 + Math.random() * 1.2; }

  // Swans: drift about, chase the boat when it comes near, back off after a collision.
  for (const s of swans) {
    s.cool = Math.max(0, s.cool - dt);
    const dx = boat.x - s.x, dy = boat.y - s.y, d = Math.hypot(dx, dy);
    s.chase = live && s.cool <= 0 && d < 46 + level * 4;
    let sp;
    if (s.chase) { s.a = steer(s.a, Math.atan2(dy, dx), 2.6 * dt); sp = Math.min(42, 21 + level * 2.5); }
    else if (s.cool > 0) { s.a = steer(s.a, Math.atan2(-dy, -dx), 3 * dt); sp = 16; }
    else {
      if ((s.wt -= dt) <= 0) { s.wt = 2 + Math.random() * 3; s.ta = Math.random() * Math.PI * 2; }
      s.a = steer(s.a, s.ta, dt); sp = 9;
    }
    const nx = s.x + Math.cos(s.a) * sp * dt, ny = s.y + Math.sin(s.a) * sp * dt;
    if (inLake(nx, ny, 7)) { s.x = nx; s.y = ny; }
    else { s.ta = Math.atan2(CY - s.y, CX - s.x); s.a = steer(s.a, s.ta, 4 * dt); s.wt = 1.5; }
    if (live && state === 'play' && invuln <= 0 && d < 8) hit(s, dx, dy, d);
  }
  for (let i = 0; i < swans.length; i++) for (let j = i + 1; j < swans.length; j++) {
    const a = swans[i], b = swans[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d < 11 && d > 0.01) {
      const push = (11 - d) / 2, ux = dx / d * push, uy = dy / d * push;
      if (inLake(a.x - ux, a.y - uy, 7)) { a.x -= ux; a.y -= uy; }
      if (inLake(b.x + ux, b.y + uy, 7)) { b.x += ux; b.y += uy; }
    }
  }

  // Difficulty: a new level every 80 points, one more swan per level (up to 7).
  if (live && state === 'play') {
    const lv = 1 + Math.floor(score / 80);
    if (lv > level) {
      level = lv; sfx.level();
      floats.push({ x: CX, y: 20, text: 'LV' + level, col: '#9ff0a0', life: 1.6 });
    }
    if (swans.length < Math.min(7, level)) addSwan();
  }

  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; const k = Math.pow(0.15, dt); p.vx *= k; p.vy *= k; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 12 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
}

/* ---------- Render ---------- */
function drawParts(layer) {
  for (const p of parts) {
    if (p.layer !== layer) continue;
    ctx.fillStyle = layer === 0 && p.life / p.max < 0.45 ? '#8fc0e4' : p.col;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
  }
}
function drawNet() {
  if (!net) return;
  const k = net.t / 0.35, r = Math.round(4 + 5 * Math.min(1, k * 2.5));
  ctx.globalAlpha = k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1;
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
    const d = x * x + y * y;
    if (d > r * r + r) continue;
    if (d >= (r - 1) * (r - 1)) ctx.fillStyle = '#5a3a1a';
    else if (((x + y) % 3 + 3) % 3 === 0 || ((x - y) % 3 + 3) % 3 === 0) ctx.fillStyle = '#efe6c8';
    else continue;
    ctx.fillRect(net.x + x, net.y + y, 1, 1);
  }
  ctx.globalAlpha = 1;
}
function render() {
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() - .5) * 3), Math.round((Math.random() - .5) * 3));
  ctx.drawImage(bg, 0, 0);

  ctx.fillStyle = '#78b0dc';
  for (const s of sparkles) if (Math.sin(t * 1.3 + s.p) > 0.8) ctx.fillRect(s.x, s.y, 2, 1);

  for (const f of fish) {
    ctx.globalAlpha = Math.max(0, Math.min(1, f.age / 0.6, (f.life - f.age) / 1)) * 0.9;
    const right = Math.cos(f.a) >= 0;
    drawC(f.gold ? (right ? FISH.GR : FISH.GL) : (right ? FISH.R : FISH.L), f.x, f.y);
  }
  ctx.globalAlpha = 1;

  drawParts(0);
  drawNet();
  if (!(invuln > 0 && state === 'play' && Math.floor(t * 12) % 2)) {
    const idx = ((Math.round(boat.a / (Math.PI * 2) * BOAT_DIRS) % BOAT_DIRS) + BOAT_DIRS) % BOAT_DIRS;
    drawC(BOAT[idx], boat.x, boat.y + (state === 'title' ? Math.round(Math.sin(t * 2)) * 0.5 : 0));
  }

  for (const s of swans) {
    const right = Math.cos(s.a) >= 0, y = s.y + (Math.sin(t * 2 + s.bob) > 0.6 ? -1 : 0);
    drawC(right ? SWAN_R : SWAN_L, s.x, y);
    if (s.chase && Math.floor(t * 5) % 2) pText('!', s.x + (right ? 3 : -3), y - 12, '#ff4d4d');
  }

  drawParts(1);
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 2); pText(f.text, f.x, f.y, f.col); }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------- Layout & loop ---------- */
function fit() {
  const coarse = matchMedia('(pointer: coarse)').matches;
  const availW = Math.min(innerWidth - 40, 960);
  const availH = innerHeight - (coarse ? 200 : 110);
  let w = Math.max(160, Math.min(availW, availH * 4 / 3));
  const scale = w / W;
  if (scale >= 2) w = Math.floor(scale) * W;   // integer scaling keeps pixels crisp
  document.documentElement.style.setProperty('--w', Math.floor(w) + 'px');
}
addEventListener('resize', fit);
fit();

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt, true);
  else if (state !== 'pause') update(dt, false);
  render();
  requestAnimationFrame(loop);
}
reset();
titleScreen();
requestAnimationFrame(loop);
</script>
</body>
</html>
